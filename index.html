<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Translation Tool</title>
  <style>
body {
  font-family: Arial, sans-serif;
  background: #eef4ff;
  color: #1e293b;
  max-width: 650px;
  margin: 35px auto;
  padding: 25px;
}

h1 {
  color: #2457c5;
  text-align: center;
}

textarea, select {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 16px;
}

button {
  background: #2457c5;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 12px 18px;
  cursor: pointer;
  margin: 5px 0;
}

button:hover {
  background: #173f98;
}

#result {
  background: white;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  padding: 15px;
  min-height: 30px;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
  <h1>Language Translation Tool</h1>
  <p>Enter text and choose the languages to translate.</p>

  <label for="source">Source Language:</label>
  <select id="source">
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="te-IN">Telugu</option>
    <option value="ur">Urdu</option>
  </select>

  <br><br>

  <label for="target">Target Language:</label>
  <select id="target">
    <option value="hi">Hindi</option>
    <option value="en">English</option>
    <option value="te-IN">Telugu</option>
    <option value="ur">Urdu</option>
  </select>

  <br><br>

  <textarea id="inputText" rows="5" cols="40"
    placeholder="Enter your text here..."></textarea>

  <br><br>

  <button onclick="translateText()">Translate</button>

  <h3>Translation:</h3>
  <p id="result">Your translation will appear here.</p>
  <br><br>
<button onclick="copyTranslation()">Copy Translation</button>

  <script>
    async function translateText() {
  const text = document.getElementById("inputText").value.trim();
  const source = document.getElementById("source").value;
  const target = document.getElementById("target").value;
  const result = document.getElementById("result");

  if (!text) {
    result.textContent = "Please enter some text first.";
    return;
  }

  if (source === target) {
    result.textContent = text;
    return;
  }

  result.textContent = "Translating...";

  try {
    const url =
      "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(text) +
      "&langpair=" + encodeURIComponent(source + "|" + target);

    const response = await fetch(url);
    if (!response.ok) throw new Error("Request failed");

    const data = await response.json();

    if (data.responseStatus !== 200) {
      throw new Error("Translation unavailable");
    }

    result.textContent = data.responseData.translatedText;
  } catch (error) {
    result.textContent =
      "Translation failed. Please try again later.";
  }
}
    async function copyTranslation() {
  const text = document.getElementById("result").textContent;

  try {
    await navigator.clipboard.writeText(text);
    alert("Translation copied!");
  } catch (error) {
    alert("Copy failed. Please copy the translation manually.");
  }
}
  </script>
</body>
</html>
