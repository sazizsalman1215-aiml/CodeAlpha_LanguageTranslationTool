<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #fdf4ff 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!-- Main Container Card -->
    <div class="w-full max-w-2xl glass-card rounded-[2.5rem] shadow-[0_20px_50px_rgba(59,130,246,0.12)] border border-white p-6 sm:p-10 transition-all">
        
        <!-- Header Title & Subtitle -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600/10 text-blue-600 mb-3 shadow-inner">
                <i class="fa-solid fa-language text-2xl"></i>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-indigo-700 tracking-tight">
                Language Translation Tool
            </h1>
            <p class="text-gray-500 mt-2 text-sm sm:text-base font-medium">
                Enter text and choose the languages to translate.
            </p>
        </div>

        <!-- Language Selectors Section -->
        <div class="grid grid-cols-1 sm:grid-cols-[1fr_auto_1fr] gap-3 items-center mb-6">
            <!-- Source Language -->
            <div>
                <label for="sourceLang" class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wider">
                    Source Language
                </label>
                <div class="relative">
                    <select id="sourceLang" class="w-full bg-slate-50/80 border border-slate-200/80 rounded-2xl px-4 py-3.5 text-slate-800 font-semibold appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition cursor-pointer shadow-sm">
                        <option value="en">English</option>
                        <option value="ur">Urdu</option>
                        <option value="hi">Hindi</option>
                        <option value="te">Telugu</option>
                        <option value="ar">Arabic</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-xs"></i>
                </div>
            </div>

            <!-- Swap Button -->
            <div class="flex justify-center sm:pt-6">
                <button onclick="swapLanguages()" title="Swap Languages" class="p-3.5 bg-slate-100 hover:bg-blue-600 hover:text-white text-slate-600 rounded-full transition-all duration-300 hover:rotate-180 active:scale-90 shadow-md">
                    <i class="fa-solid fa-arrow-right-arrow-left text-sm"></i>
                </button>
            </div>

            <!-- Target Language -->
            <div>
                <label for="targetLang" class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wider">
                    Target Language
                </label>
                <div class="relative">
                    <select id="targetLang" class="w-full bg-slate-50/80 border border-slate-200/80 rounded-2xl px-4 py-3.5 text-slate-800 font-semibold appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition cursor-pointer shadow-sm">
                        <option value="ur">Urdu</option>
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="te">Telugu</option>
                        <option value="ar">Arabic</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-xs"></i>
                </div>
            </div>
        </div>

        <!-- Input Textarea Box -->
        <div class="mb-6 relative">
            <div class="relative border border-slate-200/80 rounded-3xl bg-slate-50/50 focus-within:bg-white focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-transparent transition shadow-sm overflow-hidden">
                <textarea id="sourceText" placeholder="Type or paste your text here..." 
                    class="w-full h-36 p-5 bg-transparent border-none focus:outline-none resize-none text-slate-800 text-base sm:text-lg leading-relaxed placeholder-slate-400"></textarea>

                <!-- Clear Text Button (X) -->
                <button id="clearBtn" onclick="clearInput()" title="Clear text" 
                    class="hidden absolute top-4 right-4 p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-200/60 rounded-full transition">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>

                <!-- Input Box Action Toolbar -->
                <div class="flex items-center justify-between border-t border-slate-200/60 px-5 py-3 bg-white/40">
                    <button onclick="speakText('sourceText', 'sourceLang')" title="Listen Source Text" 
                        class="px-3 py-1.5 text-slate-600 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition flex items-center gap-2 text-xs font-semibold">
                        <i class="fa-solid fa-volume-high text-sm"></i>
                        <span>Listen</span>
                    </button>
                    <span id="charCount" class="text-xs font-medium text-slate-400">0 characters</span>
                </div>
            </div>
        </div>

        <!-- Translate Action Button -->
        <div class="mb-8">
            <button onclick="executeTranslation()" id="translateBtn" 
                class="w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 active:scale-[0.98] text-white font-bold rounded-2xl shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2.5">
                <i class="fa-solid fa-sparkles text-lg"></i>
                <span>Translate Now</span>
            </button>
        </div>

        <!-- Output Box Section -->
        <div>
            <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wider">
                Translation Result
            </label>
            <div class="border border-slate-200/80 rounded-3xl bg-slate-50/70 min-h-[10rem] p-5 flex flex-col justify-between transition shadow-sm">
                
                <!-- Target Text Result Box -->
                <div id="targetText" class="text-slate-800 text-lg sm:text-xl font-medium leading-relaxed min-h-[4rem] whitespace-pre-wrap">
                    <span class="text-slate-400 italic text-base">Translated output will appear here...</span>
                </div>

                <!-- Output Box Action Toolbar -->
                <div class="flex items-center justify-between border-t border-slate-200/60 pt-3.5 mt-4">
                    <div class="flex items-center gap-2">
                        <!-- Listen Output Sound Button -->
                        <button onclick="speakText('targetText', 'targetLang')" title="Listen Translation" 
                            class="px-3.5 py-2 text-slate-600 hover:text-blue-600 hover:bg-blue-100/50 rounded-xl transition flex items-center gap-2 text-xs font-semibold">
                            <i class="fa-solid fa-volume-high text-sm text-blue-600"></i>
                            <span>Listen</span>
                        </button>
                        
                        <!-- Copy Translation Button -->
                        <button onclick="copyOutput()" id="copyBtn" title="Copy Translation" 
                            class="px-3.5 py-2 text-slate-600 hover:text-blue-600 hover:bg-blue-100/50 rounded-xl transition flex items-center gap-2 text-xs font-semibold">
                            <i class="fa-regular fa-copy text-sm"></i>
                            <span>Copy</span>
                        </button>
                    </div>

                    <span id="statusText" class="text-xs font-semibold text-slate-400 bg-slate-200/50 px-3 py-1 rounded-full">Ready</span>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript Engine -->
    <script>
        const sourceTextInput = document.getElementById('sourceText');
        const clearBtn = document.getElementById('clearBtn');
        const charCount = document.getElementById('charCount');

        sourceTextInput.addEventListener('input', () => {
            const val = sourceTextInput.value;
            charCount.innerText = `${val.length} characters`;
            if (val.trim().length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
        });

        async function executeTranslation() {
            const text = sourceTextInput.value.trim();
            const sourceLang = document.getElementById('sourceLang').value;
            const targetLang = document.getElementById('targetLang').value;
            const targetDiv = document.getElementById('targetText');
            const statusText = document.getElementById('statusText');

            if (!text) {
                targetDiv.innerHTML = '<span class="text-slate-400 italic text-base">Please enter some text above to translate.</span>';
                return;
            }

            statusText.innerText = 'Translating...';
            statusText.className = 'text-xs font-semibold text-blue-600 bg-blue-50 px-3 py-1 rounded-full animate-pulse';

            const isRoman = /^[a-zA-Z0-9\s.,?!'-]+$/.test(text);
            const sl = (isRoman && sourceLang !== 'en') ? 'auto' : sourceLang;

            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data && data[0]) {
                    let translatedResult = '';
                    data[0].forEach(item => {
                        if (item[0]) translatedResult += item[0];
                    });

                    targetDiv.innerText = translatedResult;
                    statusText.innerText = 'Translated';
                    statusText.className = 'text-xs font-semibold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full';
                } else {
                    throw new Error('Translation failed');
                }
            } catch (err) {
                statusText.innerText = 'Error';
                statusText.className = 'text-xs font-semibold text-rose-600 bg-rose-50 px-3 py-1 rounded-full';
                targetDiv.innerText = 'Failed to fetch translation. Please check your internet connection.';
            }
        }

        function clearInput() {
            sourceTextInput.value = '';
            document.getElementById('targetText').innerHTML = '<span class="text-slate-400 italic text-base">Translated output will appear here...</span>';
            clearBtn.classList.add('hidden');
            charCount.innerText = '0 characters';
            const statusText = document.getElementById('statusText');
            statusText.innerText = 'Ready';
            statusText.className = 'text-xs font-semibold text-slate-400 bg-slate-200/50 px-3 py-1 rounded-full';
        }

        function swapLanguages() {
            const src = document.getElementById('sourceLang');
            const tgt = document.getElementById('targetLang');
            const temp = src.value;
            src.value = tgt.value;
            tgt.value = temp;

            if (sourceTextInput.value.trim().length > 0) {
                executeTranslation();
            }
        }

        function copyOutput() {
            const text = document.getElementById('targetText').innerText;
            if (!text || text.includes('Translated output will appear here...')) return;

            navigator.clipboard.writeText(text).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerHTML = '<i class="fa-solid fa-check text-emerald-600 text-sm"></i><span class="text-emerald-600">Copied!</span>';
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fa-regular fa-copy text-sm"></i><span>Copy</span>';
                }, 2000);
            });
        }

        function speakText(elementId, langElementId) {
            let text = '';
            if (elementId === 'sourceText') {
                text = sourceTextInput.value;
            } else {
                text = document.getElementById('targetText').innerText;
                if (!text || text.includes('Translated output will appear here...') || text.includes('Failed')) return;
            }

            const lang = document.getElementById(langElementId).value;

            if (!text.trim()) return;

            const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${lang}&client=tw-ob`;

            const audio = new Audio(audioUrl);
            audio.play().catch(err => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    const localeMap = { 'en': 'en-US', 'hi': 'hi-IN', 'te': 'te-IN', 'ur': 'ur-IN', 'ar': 'ar-SA' };
                    utterance.lang = localeMap[lang] || lang;
                    window.speechSynthesis.speak(utterance);
                }
            });
        }
    </script>
</body>
</html>
